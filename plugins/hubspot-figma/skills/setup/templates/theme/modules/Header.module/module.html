{% require_css %}
<style>
  {% scope_css %}
  .header-bar {
    background: {{ module.style.background.color|default('var(--color-paper)', true) }};
    color: {{ module.style.text_color.color|default('var(--color-ink)', true) }};
    border-bottom: 1px solid {{ module.style.border_color.color|default('var(--color-line)', true) }};
    font-family: var(--font-sans);
    position: sticky;
    top: 0;
    z-index: 40;
    backdrop-filter: blur(6px);
  }

  .header-row {
    max-width: var(--content-width);
    margin: 0 auto;
    padding: 20px var(--section-pad-x);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .header-logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
  }

  .header-logo-mark {
    width: 28px;
    height: 28px;
    flex: none;
  }

  .header-logo-mark svg {
    display: block;
    width: 100%;
    height: 100%;
    fill: currentColor;
  }

  .header-logo-text {
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -1px;
  }

  .header-nav {
    display: none;
    align-items: center;
    gap: 32px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .header-nav a {
    font-size: 14px;
  }

  .header-cta {
    display: none;
  }

  @media (min-width: 860px) {
    .header-nav,
    .header-cta {
      display: flex;
    }
  }
  {% end_scope_css %}
</style>
{% end_require_css %}

<header class="header-bar">
  <div class="header-row">
    <a href="/" class="header-logo">
      <span class="header-logo-mark">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 31L15 5H22L9 31H2ZM17 31L24 17L34 31H26L23 26L21 31H17Z" fill="currentColor"/>
        </svg>
      </span>
      <span class="header-logo-text">{{ module.logo_text }}</span>
    </a>

    {% if module.nav_links|length > 0 %}
      <ul class="header-nav">
        {% for item in module.nav_links %}
          <li><a href="{{ item.link.url.href|default('#', true) }}" class="link-underline">{{ item.link_label }}</a></li>
        {% endfor %}
      </ul>
    {% endif %}

    {% if module.cta_text %}
      <a href="{{ module.cta_link.url.href|default('#', true) }}" class="button--primary header-cta">
        {{ module.cta_text }}
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5 13L13 5M13 5H6M13 5V12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    {% endif %}
  </div>
</header>
